[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixtum-plugin-example-backend"
version = "0.1.0"
description = "Example Django plugin for Mixtum"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Django>=6.1,<6.2", "djangorestframework>=3.18,<3.19"]

[tool.setuptools]
packages = ["plugins.plugin_example", "plugins.plugin_example.migrations"]

[tool.setuptools.package-dir]
"plugins.plugin_example" = "."
