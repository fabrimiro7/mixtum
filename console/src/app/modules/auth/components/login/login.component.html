<main class="flex min-h-screen items-center justify-center bg-slate-50 px-6">
  <section class="mixtum-brand-border w-full max-w-md rounded-xl border-t-4 bg-white p-8 shadow-sm" aria-labelledby="login-title">
    @if ((branding$ | async)?.logo_compact; as logo) {
      <img [src]="logo" alt="" class="mb-4 h-10 max-w-32 object-contain" />
    }
    <p class="text-sm font-semibold uppercase tracking-wide text-slate-700">Mixtum Console</p>
    <h1 id="login-title" class="mt-3 text-2xl font-semibold text-slate-900">Accedi al tuo workspace</h1>
    <p class="mt-3 text-sm text-slate-600">Verrai reindirizzato al servizio di accesso della tua organizzazione.</p>
    @if (error) {
      <p role="alert" class="mt-4 rounded-md bg-red-50 p-3 text-sm text-red-700">{{ error }}</p>
    }
    <button type="button" (click)="login()" [disabled]="isLoading"
      class="mixtum-brand-button mt-8 w-full rounded-md px-4 py-3 text-sm font-semibold disabled:opacity-50">
      {{ isLoading ? 'Apertura in corso…' : 'Accedi con Keycloak' }}
    </button>
  </section>
</main>
