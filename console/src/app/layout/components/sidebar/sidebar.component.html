<div class="flex h-full flex-col py-6">
  <a routerLink="/dashboard" class="mixtum-brand-border flex items-center gap-2 border-l-4 pl-3 text-xl font-bold tracking-tight text-slate-900">
    @if ((branding$ | async)?.logo_compact; as logo) {
      <img [src]="logo" alt="" class="h-8 w-8 object-contain" />
    }
    Mixtum
  </a>

  <div class="mt-10">
    <label for="workspace-select" class="block text-sm font-medium text-slate-700">Workspace</label>
    <select id="workspace-select" class="mt-2 w-full rounded-md border border-slate-300 bg-white p-2 text-sm"
      [value]="(selectedWorkspaceId$ | async) ?? ''" (change)="selectWorkspace($event)">
      <option value="" disabled>Seleziona un workspace</option>
      @for (workspace of (workspaces$ | async) ?? []; track workspace.id) {
        <option [value]="workspace.id">{{ workspace.name }}</option>
      }
    </select>
  </div>

  <nav aria-label="Navigazione principale" class="mt-10">
    <a routerLink="/dashboard" routerLinkActive="bg-indigo-50 text-indigo-700"
      class="block rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">Dashboard</a>
    @for (item of pluginNavigation; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="bg-indigo-50 text-indigo-700"
        class="mt-1 block rounded-md px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">{{ item.label }}</a>
    }
  </nav>

  <div class="mt-auto border-t border-slate-200 pt-5">
    <p class="truncate text-sm text-slate-600">{{ (currentUser$ | async)?.email || (currentUser$ | async)?.username }}</p>
    <button type="button" class="mt-3 text-sm font-semibold text-indigo-700 hover:text-indigo-500" (click)="logout()">Esci</button>
    @if (logoutError) {
      <p role="alert" class="mt-2 text-sm text-red-700">Impossibile completare l’uscita. Riprova.</p>
    }
  </div>
</div>
