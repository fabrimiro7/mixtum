[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixtum-extension-demo-support-backend"
version = "0.1.0"
description = "Demonstration customer extension for the Mixtum Ticket capability"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Django>=6.1,<6.2",
  "djangorestframework>=3.18,<3.19",
  "mixtum-plugin-ticket-backend==0.1.0",
]

[tool.setuptools]
packages = ["extensions.demo_support"]

[tool.setuptools.package-dir]
"extensions.demo_support" = "."
