<div>

  @if (isMobileMenuOpen) {
    <div class="relative z-50 lg:hidden" role="dialog" aria-modal="true">
      <div class="fixed inset-0 bg-zinc-900" aria-hidden="true" (click)="closeMobileMenu()"></div>
      <div class="fixed inset-0 flex">
        <div class="relative mr-16 flex w-full max-w-xs flex-1">
          <div class="absolute top-0 left-full flex w-16 justify-center pt-5">
            <button type="button" class="-m-2.5 p-2.5" (click)="closeMobileMenu()">
              <span class="sr-only">Close sidebar</span>
              <svg class="size-6 text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
          <app-sidebar class="flex grow flex-col gap-y-5 overflow-y-auto bg-white px-6 pb-2"></app-sidebar>
        </div>
      </div>
    </div>
  }

  <div class="hidden lg:fixed lg:inset-y-0 lg:z-50 lg:flex lg:flex-col">
    <app-sidebar class="flex grow flex-col gap-y-5 overflow-y-auto border-r border-gray-100 bg-zinc-100 px-6"></app-sidebar>
  </div>

  <div class="sticky top-0 z-40 flex items-center gap-x-6 bg-white px-4 py-4 shadow-xs sm:px-6 lg:hidden">
    <button type="button" class="-m-2.5 p-2.5 text-gray-700" (click)="openMobileMenu()">
      <span class="sr-only">Open sidebar</span>
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
    <div class="flex-1 text-sm/6 font-semibold text-gray-900">Dashboard</div>
</div>


<main class="flex flex-1 flex-col pb-2 lg:min-w-0 lg:pt-2 lg:pr-2 lg:pl-64 min-h-[100vh]">
  <div class="grow p-6 lg:rounded-lg bg-white lg:p-10 lg:shadow-xs lg:ring-1 lg:ring-zinc-950/5 dark:lg:bg-zinc-900 dark:lg:ring-white/10">
    <router-outlet></router-outlet>
  </div>
</main>

</div>
