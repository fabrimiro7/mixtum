name: ${COMPOSE_PROJECT_NAME}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
    volumes:
      - ./keycloak/realm-mixtum.json:/opt/keycloak/data/import/realm-mixtum.json:ro
      - keycloak_data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  web:
    build:
      context: .
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      AUTH_MODE: ${AUTH_MODE:-keycloak}
      SETTINGS_ENV: ${SETTINGS_ENV:-local}
      DEBUG: ${DEBUG:-0}
      USE_S3: ${USE_S3:-0}
      POSTGRES_DB: ${POSTGRES_DB:-mixtumdb}
      POSTGRES_USER: ${POSTGRES_USER:-mixtumuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?KEYCLOAK_ISSUER is required}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:?KEYCLOAK_JWKS_URL is required}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-mixtum}
      KEYCLOAK_API_AUDIENCE: ${KEYCLOAK_API_AUDIENCE:?KEYCLOAK_API_AUDIENCE is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      AWS_QUERYSTRING_AUTH: ${AWS_QUERYSTRING_AUTH:-1}
      AWS_S3_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY_ID:-}
      AWS_S3_SECRET_ACCESS_KEY: ${AWS_S3_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-eu-south-1}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_SIGNATURE_VERSION: ${AWS_S3_SIGNATURE_VERSION:-s3v4}
      AWS_S3_ADDRESSING_STYLE: ${AWS_S3_ADDRESSING_STYLE:-virtual}
      AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
      AWS_MEDIA_LOCATION: ${AWS_MEDIA_LOCATION:-media}
      AWS_STATIC_LOCATION: ${AWS_STATIC_LOCATION:-static}
      AWS_S3_CACHE_CONTROL: ${AWS_S3_CACHE_CONTROL:-max-age=86400, s-maxage=86400, must-revalidate}
      STATIC_ON_S3: ${STATIC_ON_S3:-0}
      MIXTUM_INSTANCE_ROOT: /app
      MIXTUM_COMPOSITION_MODULE: mixtum_instance.composition
    command: ["gunicorn", "mixtum_core.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "120"]
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  console:
    image: nginx:1.29-alpine
    volumes:
      - ./artifacts/console/browser:/usr/share/nginx/html:ro
      - ./console/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:4200:80"
    restart: unless-stopped

volumes:
  postgres_data:
  keycloak_data:
  media_data:
